# CTF Calendar Nginx 配置
#
# 部署前：
#   1. 将 ctf-calendar.example.com 替换为实际域名
#   2. 运行 certbot 获取 SSL 证书:
#      certbot --nginx -d your-domain.com
#   3. 证书自动续期（certbot 默认已添加 systemd timer）

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name ctf-calendar.example.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    server_name ctf-calendar.example.com;

    # SSL 证书（certbot 自动管理）
    ssl_certificate     /etc/letsencrypt/live/ctf-calendar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctf-calendar.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ctf-calendar.example.com/chain.pem;

    # 现代 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (告知浏览器始终使用 HTTPS)
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 4M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/ctf-calendar/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
