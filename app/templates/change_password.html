{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
      </svg>
      <h2>修改密码</h2>
    </div>

    <form method="POST" action="/auth/change-password">
      <div class="form-group">
        <label for="old_password">当前密码</label>
        <input type="password" id="old_password" name="old_password" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label for="new_password">新密码</label>
        <input type="password" id="new_password" name="new_password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm_password">确认新密码</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn auth-btn">修改密码</button>
      <a href="/admin" class="btn secondary" style="width:100%;justify-content:center;margin-top:8px">取消</a>
    </form>
  </div>
</div>

{% endblock %}
